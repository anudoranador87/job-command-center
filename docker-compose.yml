services:
  postgres:
    image: postgres:16-alpine
    container_name: jcc-postgres
    restart: always
    environment:
      POSTGRES_USER: jcc_user
      POSTGRES_PASSWORD: jcc_password
      POSTGRES_DB: job_command_center
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: jcc-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@jcc.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
